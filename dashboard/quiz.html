"id":"cfjsqgi","phase":"p3","q":"Which costs more, input or output tokens, usually?","a":"Output tokens."},{"id":"c19pcocq","phase":"p3","q":"Why check the pricing page on the day you quote?","a":"Prices change often, so an old number could make my quote wrong."},{"id":"c1tdgt77","phase":"p3","q":"Why does client work run on the client's own paid account?","a":"The free tier uses content to improve Google's products and, for EEA/Swiss/UK users, only paid services may be used. It also keeps the usage bill with the client."},{"id":"c1pwga46","phase":"p3","q":"Which three costs go in a quote?","a":"My build fee (once), the AI usage (on the client's own account), and hosting or maintenance (monthly)."},{"id":"cjdzm9r","phase":"p3","q":"Why have the client pay the AI provider directly?","a":"They see the real cost and control it, and for EU users a paid account is required anyway."},{"id":"cm2276n","phase":"p3","q":"How many input tokens per day for 500 messages of 120 tokens?","a":"500 × 120 = 60,000 input tokens a day (and 20,000 output tokens)."},{"id":"c1rxshpd","phase":"p3","q":"What makes a good first Upwork job for you?","a":"Small, clearly described, a client with a verified payment method and some history, and it fits something I've built."},{"id":"c124lz2g","phase":"p3","q":"Name six red flags in a job post.","a":"Free work or a test project, moving to WhatsApp/Telegram or paying outside Upwork, asking me to pay or buy something first, an AI-training job needing a fee, asking for ID or a selfie, unknown files, a vague scope with a big promise, or no verified payment method."},{"id":"c1op4lvy","phase":"p3","q":"Which columns does your market research table have?","a":"Title, what the client wants, tools named, budget, client history, and could I do it after Phase 4."},{"id":"ctpdw3y","phase":"p3","q":"Why add a maximum number of loops?","a":"A confused model could keep calling tools forever and cost money."},{"id":"c16rdrt7","phase":"p3","q":"Where does the key come from in your script, and what must you never do with it?","a":"From `.env` via python-dotenv. Never print it."},{"id":"c1hwxi4y","phase":"p3","q":"What do you do before building, and why?","a":"Write the test messages first, so I know what \"correct\" means and can't tune the tests to fit."},{"id":"c2fu85b","phase":"p3","q":"What do you tell a client afraid of AI mistakes?","a":"It will sometimes be wrong: I measure how often with a test set, uncertain cases go to a person for review, and every decision is logged so we can see and fix mistakes."},{"id":"c5uxl7m","phase":"p3","q":"A business owner asks \"do I need an AI agent?\". How do you answer honestly?","a":"Probably not: if the steps are known a plain workflow is cheaper, faster and predictable. An agent is only for cases where the path depends on the input."},{"id":"cl39cct","phase":"p3","q":"\"What happens if the AI is wrong?\"","a":"Output is validated, uncertain cases go to a person, and every decision is logged, so mistakes are caught and fixable."},{"id":"cx4csj","phase":"p3","q":"What must your exam answers include besides correct facts?","a":"An honest answer on when an agent is overkill."},{"id":"c1te6kq0","phase":"p4","q":"What is idempotency in a workflow?","a":"Running it twice does not do the thing twice, for example by marking rows as notified."},{"id":"c11ujcok","phase":"p4","q":"What is least privilege?","a":"Give a tool only the access it needs. For example, don't leave a key that can read and write your whole production database in a tool."},{"id":"c1qvomgm","phase":"p4","q":"What does the Supabase service_role key do?","a":"It bypasses row-level security, so it must stay in a trusted server or n8n credential, never in a repo or chat."},{"id":"c4ezp1y","phase":"p4","q":"Polling vs webhook for a localhost n8n?","a":"Your n8n can call out and poll, but outside services can't call a localhost webhook."},{"id":"c1sblbhw","phase":"p4","q":"When may you email people who signed up?","a":"Only if the signup told them they'd hear from you. When unsure, notify only yourself."},{"id":"cil7jo0","phase":"p4","q":"SQL: what do the main verbs do?","a":"SELECT reads, INSERT adds, UPDATE changes, DELETE removes, CREATE TABLE makes a table."},{"id":"c110ef3i","phase":"p4","q":"Why must UPDATE and DELETE have a WHERE?","a":"Without it they change or remove every row. Run a SELECT with the same WHERE first."},{"id":"cc7gmb1","phase":"p4","q":"Primary key vs foreign key?","a":"A primary key identifies one row. A foreign key points to a row in another table, which is what a JOIN follows."},{"id":"c1o8ydr0","phase":"p4","q":"What is Row Level Security?","a":"Rules in Supabase that decide which rows each user may see."},{"id":"ccofoy5","phase":"p4","q":"Why use SQL parameters?","a":"Pasting text into a SQL string invites SQL injection."},{"id":"c1aibpge","phase":"p4","q":"What is pgvector?","a":"A Postgres extension that adds a vector column type and similarity search, used to store embeddings."},{"id":"c115mvm4","phase":"p4","q":"Why must embedding size match?","a":"The vector(N) size has to equal the embedding model's output, or search breaks."},{"id":"czibfx8","phase":"p4","q":"Six things to check in an API doc?","a":"Authentication, base URL with an example, the endpoints you need, rate limits, pagination, and webhooks."},{"id":"c6npjhu","phase":"p4","q":"Why make a booking workflow safe to run twice?","a":"Webhooks can arrive twice, which would create duplicates."},{"id":"c19165g1","phase":"p4","q":"How does argparse help a script?","a":"It lets you run it with options such as --days 30."},{"id":"c20o2ik","phase":"p4","q":"What does pytest test in Project B?","a":"The calculation function, not the API call."},{"id":"c1quh2rg","phase":"p4","q":"Why does a 30-day exchange rate request return about 20 days?","a":"Rates exist only for working days."},{"id":"cjgonab","phase":"p4","q":"Five parts of a case study?","a":"Problem, what I built, tools, result (honest about sample data), and what I'd do next."},{"id":"c9br902","phase":"p4","q":"AI disclosure checklist for a chatbot?","a":"First message says it is an AI, never pretends to be a person, says what it can do, offers a human route, links a privacy notice, and logs conversations for review."},{"id":"c1w2j7dw","phase":"p4","q":"Why not connect a first assistant to patient records?","a":"Health data is a special category under GDPR. Use general information only."},{"id":"cpv20f9","phase":"p4","q":"Make vs Zapier vs n8n words for a workflow?","a":"n8n: workflow. Make: scenario. Zapier: Zap."},{"id":"cwjgok3","phase":"p4","q":"What do WhatsApp business bots need?","a":"A verified business, a phone number, approved message templates, per-message fees and customer opt-in."},{"id":"c1hzx81k","phase":"p4","q":"Why is delay the problem for voice agents?","a":"Speech-to-text, the model and text-to-speech chain together, so each step adds waiting."},{"id":"c3veb5v","phase":"p4","q":"What does idempotent mean, and why does a workflow that runs every 15 minutes need it?","a":"Running it twice has the same effect as once. Without it the same signup is found on every run and you are notified again and again."},{"id":"c10gabyt","phase":"p4","q":"What is the marker pattern?","a":"Keep a flag such as a `notified` column. Find rows where it is false, act on them, then set it to true so the next run skips them."},{"id":"cbwinpc","phase":"p4","q":"Do you set `notified` before or after sending the email, and why?","a":"After the email succeeds. If the email fails, the row stays unmarked and is retried. The cost is a rare duplicate if it crashes between the two steps."},{"id":"c2zldqa","phase":"p4","q":"What is the difference between the publishable key and the secret key?","a":"The publishable key respects Row Level Security and is safe in public code. The secret key bypasses RLS completely and is for trusted servers only. The old name for the secret key is service_role."},{"id":"clzk54o","phase":"p4","q":"Where may the secret key be stored and where must it never go?","a":"Only in the n8n credential. Never in a repo, a chat, a prompt or a screenshot."},{"id":"cujsucl","phase":"p4","q":"Which two values does n8n's Supabase credential need?","a":"The project URL (Host, without `/rest/v1`) and a secret key."},{"id":"c1vntq8m","phase":"p4","q":"Which columns does `practice_signups` have, and what is the default of `notified`?","a":"`id`, `email`, `created_at` (default now) and `notified` (boolean, default false)."},{"id":"c16qobe4","phase":"p4","q":"Why does this workflow poll Supabase instead of waiting for a webhook?","a":"n8n runs on localhost, so Supabase can't call it. A Schedule Trigger asking every 15 minutes works."},{"id":"c94yctz","phase":"p4","q":"When may you email the people on the waitlist?","a":"Only if the signup form told them they would hear from you. Otherwise notify only yourself."},{"id":"c1413our","phase":"p4","q":"Put the notifier's nodes in order.","a":"Schedule Trigger, Supabase get rows where notified is false, check for zero rows, Google Sheets append, Gmail notify, Supabase set notified to true."},{"id":"cjvhfno","phase":"p4","q":"How do you prove the notifier is idempotent?","a":"Insert 3 fake rows, run it, run it again. Each row is notified once and the second run does nothing."},{"id":"c1qgtrer","phase":"p4","q":"What does the weekly digest contain and when does it run?","a":"Monday 08:00; the count of signups from the last 7 days and the list, emailed to me."},{"id":"c13o9hni","phase":"p4","q":"Supabase is down for an hour. What happens to the signups?","a":"The node fails and the error workflow alerts me. Rows stay unmarked, so the next successful run picks them all up."},{"id":"c1uafqw5","phase":"p4","q":"Two runs overlap. What could go wrong and how could you reduce it?","a":"Both may see the same unmarked row and notify twice. Mark the row first, or use a status column like pending/sent."},{"id":"c1mlqht5","phase":"p4","q":"The secret key leaks. What do you do?","a":"Rotate it in Supabase, update the n8n credential, and review the project's logs."},{"id":"c1sdvptr","phase":"p4","q":"What is the difference between a primary key and a foreign key?","a":"A primary key identifies one row in its own table. A foreign key stores the id of a row in another table, linking the two."},{"id":"c1abe0x5","phase":"p4","q":"Which type do you use for money and which for a time with time zone?","a":"`numeric` for money, `timestamptz` for a timestamp with time zone."},{"id":"cj0t0lf","phase":"p4","q":"In `orders`, which column is the foreign key and what does it point to?","a":"`customer_id`; it points to `customers.id`."},{"id":"caph9tx","phase":"p4","q":"Write a query for all orders over 50.","a":"`select * from orders where amount > 50;`"},{"id":"c3i0x5w","phase":"p4","q":"Write a query for the 3 biggest orders.","a":"`select * from orders order by amount desc limit 3;`"},{"id":"cjx27lp","phase":"p4","q":"Write a query for the orders from the last 7 days.","a":"`select * from orders where created_at > now() - interval '7 days';`"},{"id":"c1ptybqm","phase":"p4","q":"Write a query for the total amount per customer.","a":"`select customer_id, sum(amount) as total from orders group by customer_id;`"},{"id":"cab327p","phase":"p4","q":"What is the difference between `where` and `having`?","a":"`where` filters rows before grouping; `having` filters the groups after the aggregate is calculated."},{"id":"c17fr240","phase":"p4","q":"Which aggregates do you use to count rows and to add up amounts?","a":"`count(*)` counts rows and `sum(amount)` adds up a numeric column."},{"id":"c60h6b2","phase":"p4","q":"Write a query for the 3 biggest orders with the customer's name.","a":"`select c.name, o.amount from orders o join customers c on c.id = o.customer_id order by o.amount desc limit 3;`"},{"id":"c1tprt5y","phase":"p4","q":"How do you find customers who have no orders?","a":"`left join` orders and keep rows where the order side `is null`."},{"id":"c1vq9r40","phase":"p4","q":"What does a plain JOIN do with a customer who has no orders?","a":"Drops them; an inner join keeps only rows that match on both sides."},{"id":"cx7ns7b","phase":"p4","q":"What happens if you run `update customers set city = 'X';` with no WHERE?","a":"Every customer's city is changed to X."},{"id":"c1is54bx","phase":"p4","q":"What is the safe way to do an UPDATE?","a":"First run a `select` with the same `where` to see which rows match, then run the `update` with that `where`."},{"id":"cjbf0ta","phase":"p4","q":"Which three statements add, change and remove rows?","a":"`insert`, `update` and `delete`."},{"id":"c106p872","phase":"p4","q":"What does Row Level Security do?","a":"It decides which rows each user can see or change; policies are attached to a table. The secret (service_role) key bypasses it."},{"id":"c141x356","phase":"p4","q":"Why is gluing user text into a SQL string dangerous, and what do you do instead?","a":"The text can contain SQL that changes the query (SQL injection). Use parameters so values are never run as SQL."},{"id":"c15jh1sm","phase":"p4","q":"Why isn't the Simple Vector Store fit for a client?","a":"It keeps data in memory, so it is lost on every restart and is meant for development only."},{"id":"c1223abl","phase":"p4","q":"After `docker restart n8n`, which store still has its data?","a":"The Supabase (Postgres) one. The in-memory store is empty."},{"id":"cn292s6","phase":"p4","q":"What does pgvector add?","a":"A `vector` column type and similarity search inside Postgres."},{"id":"c78vp0a","phase":"p4","q":"What are the table and the function for?","a":"The table stores each chunk's text, metadata and embedding. The `match_documents` function returns the rows nearest to a question's embedding."},{"id":"c19jsrqj","phase":"p4","q":"What does `\u003c=>` do in the function?","a":"It is the cosine distance between two embeddings; smaller means more similar."},{"id":"cmupru9","phase":"p4","q":"What does `vector(1536)` mean and what must it match?","a":"Each embedding has 1536 numbers; that must equal the output size of the embedding model."},{"id":"c18qzzhl","phase":"p4","q":"Your insert fails with a dimension error. What do you do?","a":"Read the sizes in the error, recreate the table and function with the model's size, and keep using the same model."},{"id":"c1xlr3y7","phase":"p4","q":"Why must you not mix two embedding models in one table?","a":"Their numbers mean different things, so similarity between them is meaningless."},{"id":"cfy5be6","phase":"p4","q":"Which node mode inserts the FAQ and which lets the agent use it as a tool?","a":"Insert Documents for the loader; Retrieve Documents (As Tool for AI Agent) for the bot."},{"id":"crvuvb1","phase":"p4","q":"What happens if you run the loader twice and how do you avoid it?","a":"Every chunk is inserted twice. Clear the table first or only load new text."},{"id":"cc3dmc8","phase":"p4","q":"How would you change one FAQ answer without reloading everything?","a":"Use the node's Update Documents mode with that row's ID."},{"id":"cl1fe8o","phase":"p4","q":"Name three things you can adjust to improve a RAG bot.","a":"Chunk size and overlap, metadata filters, and an \"I don't know when unsure\" instruction."},{"id":"c1bc9ns0","phase":"p4","q":"In your own words: when is each of the two stores the right choice?","a":"Simple Vector Store for quick experiments. Supabase pgvector for anything that must survive restarts or be updated, like a client project."},{"id":"c1odp0ei","phase":"p4","q":"Name the six things a good small script has.","a":"A clear purpose, settings in one place, error handling, logging, a tested core function, and a README."},{"id":"cg7g8kt","phase":"p4","q":"What does Project B calculate for each currency?","a":"Minimum, maximum, average and percentage change over the last N days."},{"id":"c1f23kut","phase":"p4","q":"How do you get the date 30 days ago as text for an API?","a":"`(date.today() - timedelta(days=30)).isoformat()`"},{"id":"c1aw5gq4","phase":"p4","q":"Why does a 30-day request return about 20 values?","a":"The API only has working days (no weekends), so you must not hard-code a count."},{"id":"cfnvoln","phase":"p4","q":"Why add `timeout=10` and `raise_for_status()`?","a":"So the script doesn't hang forever, and so an HTTP error becomes an exception you can handle."},{"id":"chf97ul","phase":"p4","q":"Write the four argparse lines that read `--days` with a default of 30.","a":"`import argparse`, `parser = argparse.ArgumentParser()`, `parser.add_argument(\"--days\", type=int, default=30)`, `args = parser.parse_args()`; then use `args.days`."},{"id":"ctdg8z8","phase":"p4","q":"What happens with `--days abc`?","a":"argparse rejects it with an error and a usage message because it isn't an integer."},{"id":"c1xpch4w","phase":"p4","q":"Write the two logging lines that configure it and log an info message.","a":"`logging.basicConfig(level=logging.INFO, format=\"%(asctime)s %(levelname)s %(message)s\")` then `logging.info(\"fetched %d days\", n)`."},{"id":"c1v2366u","phase":"p4","q":"Name the three failures Project B must handle.","a":"The API being down, empty data, and a bad argument."},{"id":"c15b3l3f","phase":"p4","q":"Why exit with a non-zero code on failure?","a":"So the person or scheduler running it can tell it failed."},{"id":"c1u4qdnq","phase":"p4","q":"Why put the calculation in its own function?","a":"So you can test it with small hand-made numbers without calling the API."},{"id":"cyt9niq","phase":"p4","q":"What is the name rule for a pytest file and test, and how do you run them?","a":"File named like `test_report.py`, functions starting with `test_` using `assert`; run `pytest`."},{"id":"calk5oq","phase":"p4","q":"Why open the CSV file with `newline=\"\"`?","a":"Without it, Windows writes an extra blank line between rows."},{"id":"c1v8z9n4","phase":"p4","q":"Which commands set the project up from a fresh clone?","a":"`python -m venv .venv`, activate it, `pip install -r requirements.txt`, then `python report.py --days 30`."},{"id":"c1dt3dij","phase":"p4","q":"What five things go in the README?","a":"What it does, setup, usage with an example, what the output looks like, and what happens on failure."},{"id":"cspf4sn","phase":"p4","q":"How do you test that the README is good?","a":"A friend follows it without help; every question they ask is a gap."},{"id":"cvqy0qd","phase":"p4","q":"Which two tools does the assistant's agent have?","a":"An FAQ retrieval tool (vector store) and a tool that saves a lead (Google Sheet plus email)."},{"id":"c1iqsyvj","phase":"p4","q":"What business information may you use for a clinic assistant?","a":"Only public information such as opening hours and treatment types. No patient data."},{"id":"cle0n86","phase":"p4","q":"List the five things a good assistant does.","a":"Says it's an AI, answers only from approved information, says \"I don't know\" when unsure, never invents prices or hours, and offers a human route."},{"id":"cwexvnz","phase":"p4","q":"Which three tricks do you test?","a":"Asking for a discount, asking for medical advice, and \"ignore your instructions\"."},{"id":"cceks5l","phase":"p4","q":"What does Article 50 require of a chatbot, and from when?","a":"Tell users at first contact that they are talking to an AI (unless obvious), applying from 2 August 2026. Check current text; not legal advice."},{"id":"c1s7nlbi","phase":"p4","q":"List the six points of the disclosure checklist.","a":"First message says it's an AI; never pretends to be human; says what it can and can't do; human route; link to privacy notice; conversations and leads logged and reviewed."},{"id":"c1h6o7fv","phase":"p4","q":"Write a `$fromAI` expression for the visitor's email.","a":"`{{ $fromAI('email', 'the visitor email address', 'string') }}`"},{"id":"cgimccz","phase":"p4","q":"What do the arguments of `$fromAI` mean and where does it work?","a":"They are hints for the model (name, description, type), not references to data. It works only in tools connected to an AI Agent node."},{"id":"c1sg03y8","phase":"p4","q":"When must the agent call the lead tool?","a":"Only after the visitor gave a name and an email and agreed to be contacted."},{"id":"c10m6ne","phase":"p4","q":"Why doesn't Project C connect to real patient data?","a":"Health data is a special category under GDPR with strict rules; a first version uses only general public information."},{"id":"cilu84d","phase":"p4","q":"Why can't a website chat widget use your n8n, and what do you show instead?","a":"n8n runs on localhost, which the internet can't reach. Show a screen recording; a real client needs hosted n8n."},{"id":"c1g63mmz","phase":"p4","q":"What goes in the Chat Trigger's initial message?","a":"The AI disclosure, saying it is an AI assistant."},{"id":"c1m3hcuv","phase":"p4","q":"What is the test set and what do you record?","a":"8 questions in the FAQ, 4 outside it, and 3 tricks; record what the bot did for each and whether it's acceptable."},{"id":"ciutd9u","phase":"p4","q":"Name five types of tool that appear often in automation jobs.","a":"A CRM or database (Airtable, HubSpot, Notion), booking (Calendly, Cal.com), WordPress, payments (Stripe) and team chat (Slack)."},{"id":"cze6y97","phase":"p4","q":"What mode do you use to practise with Stripe-type tools?","a":"Free plans and test or sandbox mode, never live data."},{"id":"cjrs3z5","phase":"p4","q":"What are the six things you look for in an API doc?","a":"Authentication, base URL with an example request, endpoints, rate limits, pagination, and webhooks."},{"id":"c7w35b6","phase":"p4","q":"n8n has no node for a tool. What do you do?","a":"Use the HTTP Request node with a saved credential holding the key, following the tool's API doc."},{"id":"c1f51s76","phase":"p4","q":"What is the difference between an API key and OAuth2?","a":"A key is one secret you send with each request. OAuth2 has you log in and approve specific access, and the tool issues tokens."},{"id":"chdgrxt","phase":"p4","q":"Give two ways to practise outside-tool events with a localhost n8n.","a":"A local forwarder such as Stripe's CLI `stripe listen --forward-to localhost:5678/...`, or polling the tool's API from a Schedule Trigger."},{"id":"cod64ub","phase":"p4","q":"Why must a webhook handler check who sent the request?","a":"The URL can be found and posted to by anyone, so you check a signature or secret to be sure it came from the real tool."},{"id":"c1xlwsga","phase":"p4","q":"Why must a webhook workflow be safe to run twice?","a":"The sender may deliver the same event more than once (and retries on failures), so a repeat must not create duplicates."},{"id":"c1mph2om","phase":"p4","q":"Name two ways to avoid duplicates.","a":"Store processed event ids and skip repeats, or upsert by a unique key."},{"id":"cjyikgl","phase":"p4","q":"The tool's API is down. What does your workflow do?","a":"The node fails, the error workflow alerts me, and retry-on-fail covers short outages."},{"id":"c1arn3sz","phase":"p4","q":"What do you write in `integration-notes.md`?","a":"Why I chose the two tools, and the answers to the six API-doc points for each."},{"id":"c1mvk9bz","phase":"p4","q":"What must be true of each workflow before you commit it?","a":"It has an error workflow, is safe to run twice, and the export contains no credentials."},{"id":"cy9eocn","phase":"p4","q":"Name the five parts of a case study in order.","a":"Problem, what I built, tools, result, and what I'd do next."},{"id":"cciyddd","phase":"p4","q":"How long is a case study, and who is the reader?","a":"About 150 words; a client who reads it in a minute."},{"id":"cnj12dm","phase":"p4","q":"Turn \"streamlined operations\" into something specific.","a":"Say exactly what happens, for example \"notifies the owner within 15 minutes of each signup and sends a weekly count\"."},{"id":"c1c6shcj","phase":"p4","q":"You have no real client result yet. What do you write?","a":"Describe what the tests showed and label it as a prototype on sample data. Never invent numbers."},{"id":"cpzsr2m","phase":"p4","q":"What is the order of work for the case studies?","a":"Write each to 150 words, get a critique, fix every comment myself, then cut about 20%."},{"id":"c9do673","phase":"p4","q":"What are the three parts of a 2-minute demo?","a":"The problem in one sentence, the result running, and one thing I'd improve."},{"id":"c1pcrnoh","phase":"p4","q":"How do you open Game Bar and start recording?","a":"Press Win+G and use the record button, or press Win+Alt+R to start and stop."},{"id":"c15mhi7b","phase":"p4","q":"What do you check the recording for before sharing it?","a":"Keys, tokens and passwords, real emails and names or customer data, and private tabs or notifications."},{"id":"cubezrw","phase":"p4","q":"What are an n8n workflow, node and item called in Make?","a":"Scenario, module and bundle."},{"id":"c2lxy52","phase":"p4","q":"What is an n8n IF/Switch called in Make and in Zapier?","a":"A router with filters in Make; Paths (or Filter) in Zapier."},{"id":"c5476b4","phase":"p4","q":"What do the three tools call saved logins?","a":"Credentials in n8n; connections in Make and Zapier."},{"id":"c1rmwrhn","phase":"p4","q":"How do Make and Zapier charge?","a":"Make per credit (formerly operations) and Zapier per task, so more steps cost more every month."},{"id":"c1z11t5y","phase":"p4","q":"What do you say to a client who already uses Make?","a":"That I can build it in their tool and can also build it in n8n if that suits them better."},{"id":"c169ptpt","phase":"p4","q":"Which seven rows must the vocabulary table have?","a":"Trigger, step, data item, branch, loop, error handling and credentials."},{"id":"cac40ft","phase":"p4","q":"Which parts are hardest to move between tools?","a":"Data mapping and expressions, error handling, and testing."},{"id":"c1mk3frl","phase":"p4","q":"What does Pydantic do when data doesn't match the model?","a":"It raises a ValidationError that lists each problem (wrong type, missing field, value out of range)."},{"id":"c102s0qs","phase":"p4","q":"How do you restrict a field to a list of allowed values?","a":"Use `Literal[\"a\", \"b\", \"c\"]` as its type."},{"id":"cvp7jn9","phase":"p4","q":"Give one thing Pydantic does not catch.","a":"A valid-looking but wrong answer, for example the wrong category. It checks shape, not truth."},{"id":"csdk7s","phase":"p4","q":"Which three uv commands create a project, add a package and run a script?","a":"`uv init`, `uv add \u003cpackage>`, `uv run \u003cscript>`."},{"id":"ckc18mi","phase":"p4","q":"What is the difference between `ruff check` and `ruff format`?","a":"`check` finds problems (linting). `format` reformats the code style."},{"id":"cmvk8v9","phase":"p4","q":"What do `uv add` and `uv run` do?","a":"`uv add` adds a package to the project; `uv run` runs a script inside the project environment."},{"id":"c2hn63l","phase":"p4","q":"Name two things ruff can find.","a":"Unused imports and other common mistakes, which `ruff check --fix` can often fix automatically."},{"id":"cy52gyo","phase":"p4","q":"What does `@app.post(\"/clean\")` mean?","a":"The function below answers POST requests at the path `/clean`."},{"id":"czwkc9","phase":"p4","q":"How does FastAPI reject bad input?","a":"The request body is checked against the Pydantic model; if it doesn't fit, FastAPI returns a 422 error automatically."},{"id":"c1x2i2r9","phase":"p4","q":"Why does `http://localhost:8000` not work from n8n in Docker?","a":"Inside the container, localhost is the container itself, not my PC. Use `host.docker.internal`."},{"id":"c1idsgdo","phase":"p4","q":"What must a client deployment of your endpoint have that your practice one doesn't?","a":"Authentication (such as an API key header) and HTTPS, because otherwise anyone who can reach the port can call it."},{"id":"c8a2pm9","phase":"p4","q":"What is the sequence of the four practice tasks?","a":"Pydantic model with a broken answer, a fresh uv project, ruff on the Project B script, and a FastAPI `/clean` endpoint called from n8n."},{"id":"c1bp5yzs","phase":"p4","q":"Why is \"an AI receptionist\" more than a workflow?","a":"It needs a phone or messaging platform, extra running costs and compliance work on top of the logic."},{"id":"c9oh3rj","phase":"p4","q":"Why can't a WhatsApp bot just message everyone?","a":"Customers must opt in, and messages you start must use Meta-approved templates, each charged by category and country."},{"id":"c1hfxe66","phase":"p4","q":"What is the 24-hour window?","a":"After a customer messages the business, it can reply with free-form messages for 24 hours at no charge."},{"id":"cuy8x0e","phase":"p4","q":"How is WhatsApp Business Platform priced?","a":"Per message, by category (marketing, utility, authentication) and country, since July 2025."},{"id":"c1s2u33f","phase":"p4","q":"What are the three stages of a voice agent?","a":"Speech-to-text, a language model, and text-to-speech, over a phone line."},{"id":"c729cya","phase":"p4","q":"What causes delay and what are costs based on?","a":"Each stage adds delay. Costs are per minute across the number, call, speech and model."},{"id":"c1om18zv","phase":"p4","q":"Who must agree before you record a call?","a":"The people on the call; rules vary by country, so check and tell the caller."},{"id":"c16d01ur","phase":"p4","q":"What five things does the receptionist answer cover?","a":"What I've built, what a phone agent needs, what it costs, the rules, and what I would and wouldn't promise."},{"id":"c18o38t4","phase":"p4","q":"Name something you must not promise.","a":"A guaranteed response time, accuracy or full automation I haven't measured."},{"id":"c1v83k8n","phase":"p4","q":"Which four words must you not use without explaining them?","a":"Item, node, API and webhook."},{"id":"cwbdc2m","phase":"p4","q":"What order does a good client explanation follow?","a":"Their problem, what happens now, what they get, and what it doesn't do yet."},{"id":"ct31kq4","phase":"p4","q":"What three things does the grader tell you?","a":"What I got wrong, what I skipped, and which words a non-technical person wouldn't know."},{"id":"c1bui056","phase":"p4","q":"What are the six questions a sceptical client asks?","a":"What happens when it breaks; how do I know it's right; what does it cost to run; who owns the code; what about customer data; why pay you instead of Zapier."},{"id":"crl7up","phase":"p4","q":"What is a good answer when you haven't tested something?","a":"Say so honestly and describe how you would test it. Never bluff."},{"id":"c1stvcn7","phase":"p4","q":"How do you answer \"what does it cost to run?\"","a":"Break it down (hosting, model calls by token, tool plans), say I'd calculate it from their volume, and show the method."},{"id":"cjs6vuw","phase":"p4","q":"How do you answer \"who owns it?\"","a":"The client owns their accounts and keys; I hand over exports, a README and a walkthrough video."},{"id":"c1mzz067","phase":"p4","q":"What is the pass mark for Phase 4 and what comes after the exam?","a":"80% plus three linkable case studies. Then diagnose the root misunderstanding, make 8 flashcards and review them for two days."},{"id":"ck93c5f","phase":"p5","q":"What is the goal of a discovery call?","a":"For you to understand the client's problem, and for them to see you listen. It is not a pitch."},{"id":"cv0d9nf","phase":"p5","q":"The seven parts of a discovery call?","a":"Agenda, the problem, the impact, current process and tools, constraints, what success looks like, and the next step."},{"id":"c1pa15ma","phase":"p5","q":"Why not quote a price on the first call?","a":"The scope isn't clear yet. Say you'll send a written fixed price with what's included."},{"id":"cn9mvmn","phase":"p5","q":"What do you do when you don't know an answer on a call?","a":"Say so, say what you have built that is close, and say how you'd check. Never bluff."},{"id":"cwachie","phase":"p5","q":"How do you get a client to say more?","a":"Ask \"can you tell me more?\" or repeat their last few words as a question, and accept silence."},{"id":"c1k7klmt","phase":"p5","q":"What does one Connect cost, and how many are free?","a":"$0.15 each. Basic accounts get 10 free a month."},{"id":"c1af3n4n","phase":"p5","q":"What does the Rising Talent badge give?","a":"More visibility and a one-time 30 free Connects."},{"id":"c1f6n5ro","phase":"p5","q":"Name four scam or red flag signs on Upwork.","a":"Pay a fee first, move to WhatsApp or Telegram, ID photos or selfies, unknown file downloads, test projects, crypto."},{"id":"cenjisy","phase":"p5","q":"How do you score a job before applying?","a":"1 to 5 on fit, and apply only to 4 or higher."},{"id":"cctvwkm","phase":"p5","q":"Proposal structure?","a":"Their problem in your words, your approach, one relevant project, one clarifying question, and a next step. About 120 words."},{"id":"c1gat6mb","phase":"p5","q":"How do you estimate a fixed price?","a":"List tasks, estimate hours, add about 50% buffer, multiply by your rate, and add the platform fee."},{"id":"c1c9rvqx","phase":"p5","q":"What goes in a scope?","a":"What's included, what isn't, rounds of changes, what you need from the client and when. Anything outside is a new quote."},{"id":"c2z710t","phase":"p5","q":"Why use milestones?","a":"They protect both sides, and you don't start work on a milestone that isn't funded."},{"id":"czjl1sd","phase":"p5","q":"Hourly vs fixed protection on Upwork?","a":"Fixed price uses funded milestones (escrow). Hourly protection generally depends on tracking time with Upwork's own tracker. Check the Help Center."},{"id":"c1u4xtid","phase":"p5","q":"Roughly what is Upwork's fee now?","a":"Variable, around 10% for most freelancers, and shown before you apply."},{"id":"c14xxgu5","phase":"p5","q":"What does a package contain?","a":"Name, who it is for, what's included, what isn't, delivery time, price, and what you need from the client."},{"id":"c1ht8hq9","phase":"p5","q":"What goes in your AI-use policy?","a":"Tools you use, what data each sees, what you never send, how you mask personal data, and a consent sentence for clients."},{"id":"c1ky4iup","phase":"p5","q":"Why can't client work run on your free Gemini key?","a":"Google's terms require paid services for anything made available to users in the EEA, Switzerland or the UK."},{"id":"c1cn1moi","phase":"p5","q":"What did Upwork's terms change on 5 Jan 2026?","a":"It may use platform content to train its AI unless you change your AI Preferences. Read the current terms yourself."},{"id":"ckiix20","phase":"p5","q":"Why start outreach with warm contacts?","a":"They agree to a 15-minute talk far more often than strangers."},{"id":"c1qdhrs8","phase":"p5","q":"Is it OK to do a first pilot for free?","a":"No. A reduced price is fine, but free work has no boundaries. Agree scope, price and case-study permission in writing."},{"id":"c1sje14n","phase":"p5","q":"Why be careful emailing strangers in the EU?","a":"Unsolicited marketing rules are strict, especially for individuals and sole traders. Prefer visits, calls and warm introductions."},{"id":"c1szkilr","phase":"p5","q":"How is this different from door-to-door sales?","a":"The client already asked for help, so we qualify each other instead of me persuading someone who didn't ask."},{"id":"cz997ij","phase":"p5","q":"Name the seven parts of a discovery call.","a":"Greet and set the agenda; the problem; the impact; the current process and tools; constraints; success; next step."},{"id":"c1tyjmk5","phase":"p5","q":"What do you say in part 1?","a":"Who I am briefly and the agenda: a few questions, how I'd approach it, then next steps."},{"id":"c7b97on","phase":"p5","q":"Give two questions for the \"impact\" and \"constraints\" parts.","a":"Impact: \"What does this cost you in time or money?\" Constraints: \"What data and access is involved, and what is your budget range and deadline?\""},{"id":"c1lfhygv","phase":"p5","q":"How do you handle a vague client who says \"I want AI for my business\"?","a":"Narrow it down: ask for one repeated task and what it costs them in time or money."},{"id":"c13ivx8f","phase":"p5","q":"What do you say when you haven't done exactly what they ask?","a":"\"I haven't done exactly that, but I've built X, and here's how I'd check it works.\" No bluffing."},{"id":"cguticv","phase":"p5","q":"What do clients look at first, in order?","a":"Photo, headline, the first two lines of the overview, portfolio items, skills and rate."},{"id":"cwd3s82","phase":"p5","q":"What makes a headline strong?","a":"It is specific: who you help and with what, not a vague title."},{"id":"c1lipbkw","phase":"p5","q":"Give three things you must never put on your profile.","a":"Fake reviews, invented clients, and skills I can't show."},{"id":"c1fzp61f","phase":"p5","q":"What rate goal does this roadmap use and why consider fixed-price offers?","a":"At least 20 euros an hour; fixed-price offers are often easier to win for small jobs at the start."},{"id":"c1f31wde","phase":"p5","q":"What is the Rising Talent badge and where do you find its current criteria?","a":"A badge for promising new freelancers that raises visibility; read the criteria on Upwork's own Rising Talent page."},{"id":"c1b3z0wm","phase":"p5","q":"Who edits the live Upwork profile?","a":"Only me. Claude reviews the text as a client would."},{"id":"c1hch5sm","phase":"p5","q":"What is the real problem with using AI on client work?","a":"Using it secretly or sending the wrong data, not using it at all."},{"id":"clzxbj1","phase":"p5","q":"What decides whether a provider keeps or trains on your data?","a":"The provider's terms; API terms usually differ from consumer chat terms, so read each one."},{"id":"c1drbpgx","phase":"p5","q":"What do you check in Upwork's settings?","a":"The AI Preferences (or similar privacy settings), and I decide my own choices."},{"id":"c1rs888r","phase":"p5","q":"A client wants you to test with their real customer list. What do you say?","a":"I'd ask to test with fake or masked data first. Real data only with written consent, and I won't paste it into a tool that isn't approved."},{"id":"cnquca4","phase":"p5","q":"Name four practical rules for AI and client data.","a":"Use fake or masked data; remove names, emails and IDs; never paste secrets; keep client data out of my own prompts and repo."},{"id":"c9vqcj5","phase":"p5","q":"What six things does ai-use-policy.md contain?","a":"The tools I use; what data each sees; what I never send; how I mask personal data; which provider terms I checked and when; and the consent sentence."},{"id":"c1jl9j31","phase":"p5","q":"What are the three things to read for?","a":"The problem (what hurts), the deliverable (what they think they need) and the signals (budget, urgency, tools, clarity)."},{"id":"cr94uzf","phase":"p5","q":"How can the problem differ from the deliverable?","a":"A client may ask for a CRM integration (deliverable) when the real problem is that leads get lost."},{"id":"cfolaib","phase":"p5","q":"Name four things to check on a client before applying.","a":"Payment verified, total spent, hire rate, reviews from freelancers (and time on Upwork)."},{"id":"cwa2d8z","phase":"p5","q":"What does a Connect cost and how many do free accounts get?","a":"$0.15 each; 10 free per month (Freelancer Plus gives about 100; sources disagree). Check your account for current numbers."},{"id":"ckeye3u","phase":"p5","q":"Why apply only to strong matches?","a":"Each proposal costs Connects that vary per job, so a few can use up the free month."},{"id":"c1mj39m","phase":"p5","q":"Name six red flags in a job post.","a":"Free samples or a test project; moving to WhatsApp/Telegram or paying outside Upwork; paying a fee or buying software/crypto first; wallet verification; ID or selfie requests; unknown files or links; huge promise with tiny budget; no description of what they want."},{"id":"c1ynz8k2","phase":"p5","q":"What must you never do?","a":"Download unknown files, pay to get work, leave the platform to be paid, or ignore something suspicious instead of reporting it."},{"id":"c1tm968k","phase":"p5","q":"What score means you should apply and what does fit include?","a":"4 or higher out of 5. Fit includes understanding the problem, a similar build, a reasonable budget, a credible client and no red flags."},{"id":"cg68j4r","phase":"p5","q":"Why do the first two lines matter?","a":"They show in the notification; clients decide from them whether to open the proposal."},{"id":"ccr4h3b","phase":"p5","q":"Turn \"Hello, I'm an expert in automation\" into a better opening for a signup-tracking job.","a":"Start with their problem, for example \"You're losing track of new signups because nobody checks the database. Here's how I'd fix it.\""},{"id":"c1b81baj","phase":"p5","q":"List the five parts of a proposal.","a":"Their problem, my approach, one relevant project with a link, one clarifying question, and a clear next step."},{"id":"c2wogx6","phase":"p5","q":"How long should a proposal be?","a":"About 120 words."},{"id":"c1ulc6hu","phase":"p5","q":"Give an example of a promise you can keep and one you can't.","a":"Keep: \"each new signup is logged and emailed within 15 minutes, tested on sample data first.\" Can't: \"this will double your sales.\""},{"id":"ct72djo","phase":"p5","q":"Who sends the proposals?","a":"Only I do, after fixing every comment from the check."},{"id":"cyj71yc","phase":"p5","q":"What is the routine for each proposal?","a":"Write it in proposals.md, run the Checker, fix every comment myself, then send it myself and note the Connect cost."},{"id":"c3lwo8z","phase":"p5","q":"Which type suits unclear work and who carries the risk?","a":"Hourly; the client carries the risk of it taking longer. Fixed price suits small defined work and I carry the estimate risk."},{"id":"c1550gh9","phase":"p5","q":"How is a fixed-price contract protected on Upwork?","a":"The client funds a milestone first (escrow) and I deliver once it's funded."},{"id":"c1u2md5g","phase":"p5","q":"What matters for protection on an hourly contract?","a":"Tracking time with Upwork's own time tracker; hours logged elsewhere may not be covered."},{"id":"ccf1ti8","phase":"p5","q":"8 hours of work, 50% buffer, 20 euros an hour. What's the quote before fees?","a":"8 × 1.5 = 12 hours; 12 × 20 = 240 euros."},{"id":"cqrds2p","phase":"p5","q":"Why add a buffer?","a":"Setup, testing and client delays take time; without it I work more hours than I'm paid for."},{"id":"cwatxko","phase":"p5","q":"How much must you charge to take home 240 euros with a 10% fee?","a":"240 ÷ 0.9 = about 267 euros."},{"id":"cn3j65h","phase":"p5","q":"Where do you see the fee and how often should you check?","a":"Before you apply, on every job, because the rate varies."},{"id":"c1bv00oz","phase":"p5","q":"What does a scope of work contain?","a":"What's included, what isn't, rounds of changes, what I need from the client and when, and that anything else is a new quote."},{"id":"c5ysko6","phase":"p5","q":"When do you start work on a milestone?","a":"Only once it's funded."},{"id":"c1d3aep4","phase":"p5","q":"Who do you ask about VAT on Upwork income?","a":"An accountant or the tax authority; Claude isn't a tax adviser."},{"id":"c1ahwipq","phase":"p5","q":"What do you say when a client asks for a change after delivery?","a":"Anything outside the agreed scope or the included rounds is a new quote; I use a change request."},{"id":"crrnvgy","phase":"p5","q":"What does a package state?","a":"What I deliver, what is and isn't included, delivery time, price, and what I need from the client."},{"id":"cll5uxr","phase":"p5","q":"Why do small clients like packages?","a":"They get a defined result at a known price instead of hiring open-ended help."},{"id":"c1x2v9qx","phase":"p5","q":"Which three packages do you offer first?","a":"A lead-capture workflow, an AI inbox sorter and a Python data report."},{"id":"c1k06s4w","phase":"p5","q":"What must back each package?","a":"A project I've built or will build; if not built yet, I note which project will prove it."},{"id":"crdge29","phase":"p5","q":"How many tiers do you offer?","a":"At most a basic and a bigger version."},{"id":"c15nqkqq","phase":"p5","q":"Give two examples of assumptions and two of exclusions.","a":"Assumptions: client has the accounts; sample data arrives within 2 days. Exclusions: hosting, ongoing maintenance, more than 2 rounds of changes."},{"id":"c1r7dq5y","phase":"p5","q":"What are the two rules for each practice call?","a":"Answer within 30 seconds, and speak the answers aloud (voice-to-text) instead of typing."},{"id":"c1if68vc","phase":"p5","q":"What does each persona practise?","a":"Café owner: narrowing a vague request. E-commerce manager: honesty, evidence and price. Technical founder: not bluffing under detailed questions."},{"id":"c2g5vqp","phase":"p5","q":"What five things does the scorecard cover?","a":"Questions I asked, listening, honesty about what I can do, clarity, and setting a next step."},{"id":"cnzkpff","phase":"p5","q":"What do you do after each call?","a":"Write down the one thing to fix, carry it into the next call, and log mistakes in mistakes.md."},{"id":"cq0jkoa","phase":"p5","q":"Why do direct outreach as well as Upwork?","a":"Upwork has few free Connects and much competition; direct contact can get a first paid job and review sooner. I need at least one case study first."},{"id":"c176oijm","phase":"p5","q":"Who do you contact first and why?","a":"Warm contacts (family, friends, gym, the clinic), because they say yes to a short conversation much more often than strangers."},{"id":"ctwpflp","phase":"p5","q":"What may you build for a physiotherapy clinic at first?","a":"Appointment-request intake, an FAQ about hours and treatments, and review requests. No patient records."},{"id":"c2t9chf","phase":"p5","q":"What are the four parts of the message?","a":"Who I am in one line, the specific problem, one result I built, and one low-effort ask."},{"id":"c13p7u2r","phase":"p5","q":"Which channels do you prefer and why?","a":"In-person visits, phone calls, LinkedIn messages and warm introductions, because EU rules on unsolicited email, especially to individuals and sole traders, are strict."},{"id":"c1v7blye","phase":"p5","q":"What goes in a half-page pilot scope?","a":"The goal, what I'll deliver, what isn't included, the price, the dates, and what I need from them."},{"id":"cqudy6r","phase":"p5","q":"Why not do the pilot for free?","a":"Free work has no boundaries; a reduced price still sets a scope and shows the work has value."},{"id":"c1m4nhox","phase":"p5","q":"Who is the persona in the redo call and what are the rules?","a":"A physiotherapy clinic owner who wants fewer no-shows but is nervous about AI and patient data, with a small budget. Same 30-second timer, no notes."},{"id":"c994kg0","phase":"p5","q":"A clinic owner says \"AI and patient data sounds risky.\" What do you say?","a":"Agree it's a real concern, propose starting with no patient data (reminders, FAQ), explain health data is a special GDPR category needing proper advice, and say what I'd minimise and log."},{"id":"c18ta251","phase":"p5","q":"What three things does the exam test?","a":"A proposal review, a 5-minute discovery call with a vague client, and a pricing question."},{"id":"c4m0c48","phase":"p5","q":"What is the pass mark and what else must be true?","a":"80%, and I can run a 15-minute call without freezing and my proposals are sent."},{"id":"c1ebbigt","phase":"p5","q":"What does the diagnose step produce?","a":"The one root misunderstanding behind my mistakes and 8 flashcards in a tab-separated file for Anki."},{"id":"cwuelzp","phase":"p6","q":"What are the five documents in a templates pack?","a":"Kickoff questionnaire, scope of work, change request, handover document and update message."},{"id":"cdq2wqw","phase":"p6","q":"What does a change request do?","a":"It states what is asked and what it changes in time and price, and needs a yes before you start. It handles scope creep politely."},{"id":"caglbtr","phase":"p6","q":"How often should you update a client?","a":"Every 2 to 3 days, even if it's \"no change, testing today\"."},{"id":"c1ubawbl","phase":"p6","q":"When do you ask for a review?","a":"After the work is accepted, and never in exchange for anything."},{"id":"c1gqraa6","phase":"p6","q":"Why record a short video walk-through at handover?","a":"The client can see how it works later, and it proves what was delivered."},{"id":"c3axdwx","phase":"p6","q":"What does the n8n licence allow for consultants?","a":"Building workflows for clients, when the client owns the instance or the client never accesses your n8n."},{"id":"chfs4oz","phase":"p6","q":"What does the n8n licence not allow without a paid licence?","a":"Hosting many clients' workflows or credentials on an n8n you run and selling it as a service, or embedding n8n in your own product."},{"id":"cq26zct","phase":"p6","q":"Whose accounts and API keys go in a client workflow?","a":"The client's own, so you never carry their costs or risk."},{"id":"c15cbfbr","phase":"p6","q":"In GDPR terms, what are you for a client's customer data?","a":"Usually a processor. Use as little personal data as possible and agree handling in writing."},{"id":"cdpwgtg","phase":"p6","q":"What does EU AI Act Article 50 ask of a chatbot?","a":"Tell people they are talking to an AI unless it is obvious, and offer a human route. Check the current text."},{"id":"c2x2mvo","phase":"p6","q":"Four ways a client's n8n can be hosted?","a":"n8n Cloud, a server the client owns, you hosting it for several clients (restricted), or the client's own existing tool."},{"id":"cgeoylb","phase":"p6","q":"Why does the n8n encryption key matter?","a":"Saved logins are encrypted with it. Lose the data volume and every saved login becomes unreadable, so back it up."},{"id":"c1xuivb8","phase":"p6","q":"What is Docker Compose?","a":"One file that describes your containers, so a server can be rebuilt with docker compose up -d."},{"id":"ceft7di","phase":"p6","q":"What is Kubernetes, and do you need it?","a":"A system that runs many containers across many servers. Small clients don't need it. Learn it only if a project requires it."},{"id":"c1yhon5j","phase":"p6","q":"Three monitoring checks for a client's automation?","a":"AI provider spending limit, automatic clean-up of old execution data, and an uptime check on /healthz."},{"id":"co2z7np","phase":"p6","q":"Why a pull request instead of committing to main?","a":"Someone reads the change, so mistakes get caught and knowledge spreads."},{"id":"c8qvvj5","phase":"p6","q":"What causes a merge conflict?","a":"Two people changed the same lines and Git can't choose."},{"id":"c1lpefhg","phase":"p6","q":"Where do team secrets live?","a":"In a shared password manager, never in chat or the repo."},{"id":"c1mtwpdv","phase":"p6","q":"Niche formula?","a":"I help [who] [get result] by [method]."},{"id":"cpj39zu","phase":"p6","q":"Why use evidence to choose a niche?","a":"Replies, calls and jobs show what the market wants, so you don't guess."},{"id":"c1esz0hc","phase":"p6","q":"Name the five templates.","a":"Kickoff questions, scope of work, change request, handover document and update message."},{"id":"cmvgdva","phase":"p6","q":"Why not paste a template unchanged?","a":"Each client and job differs; I adapt it, otherwise it can say things that don't apply or miss what matters."},{"id":"c121dzan","phase":"p6","q":"What six topics does the kickoff questionnaire cover?","a":"The problem and success, tools and who owns accounts, data and whether it's personal, who approves and the contact, deadline, and what is out of scope."},{"id":"ct1wgax","phase":"p6","q":"Name the parts of a scope of work.","a":"Goal, deliverables, exclusions, what I need from the client, milestones with prices, rounds of changes, how acceptance works, and AI and data handling."},{"id":"c174i14x","phase":"p6","q":"What does a change request contain?","a":"What's asked, the change in time and price, and the client's yes or no before I start."},{"id":"co59l8n","phase":"p6","q":"What must a handover never contain?","a":"The secrets themselves; it says where the logins live."},{"id":"cnpu1ac","phase":"p6","q":"Write the four lines of an update message.","a":"Done since last time; next steps; anything blocked; the date of the next update."},{"id":"c1h487de","phase":"p6","q":"What is the worked example and who reviews it?","a":"A scope of work and a handover for Project B as if hired, reviewed by Claude as a client who was burned before."},{"id":"cbqrak2","phase":"p6","q":"What do you confirm in writing before starting?","a":"The scope, what I need from the client, the first milestone and its date."},{"id":"c1k081zr","phase":"p6","q":"How often do you send updates and what if nothing changed?","a":"Every 2 to 3 days; send it anyway (\"no change, testing today\")."},{"id":"czgyo0r","phase":"p6","q":"What do you do when you're stuck or late?","a":"Say so early and give a new date."},{"id":"c1ntjsjh","phase":"p6","q":"What three things do you do before you deliver?","a":"Test with the client's sample data, write a short handover, and record a 3-minute video walk-through."},{"id":"cocv6fp","phase":"p6","q":"When may you ask for a review and what must you never do?","a":"After the work is accepted, kindly. Never offer anything in exchange."},{"id":"c1ehuabg","phase":"p6","q":"What are the final three steps on the checklist?","a":"Accepted, paid, then ask for the review."},{"id":"c1dqafgg","phase":"p6","q":"What do you do before writing about a client's project?","a":"Ask the client for permission."},{"id":"c1f2nq2x","phase":"p6","q":"What do you remove unless the client agrees?","a":"Their name, their data and anything that identifies them."},{"id":"c1efw8a1","phase":"p6","q":"When do you write the case study?","a":"Within a week of the job ending, while I remember it."},{"id":"cujfdlb","phase":"p6","q":"What does the check mark?","a":"Anything that might identify the client and anything I can't prove."},{"id":"ce7urrw","phase":"p6","q":"Who answers your tax and VAT questions?","a":"An accountant or the tax authority. Claude only helps me prepare the questions."},{"id":"c1htno19","phase":"p6","q":"Name six questions for the accountant.","a":"Does Upwork work fit my registration; how to invoice; VAT on services to EU and non-EU business clients (reverse charge); whether KOR applies; EU sales listings; how Upwork's fee is booked; income tax and deductions; which records to keep."},{"id":"cmyuy99","phase":"p6","q":"In a client's workflow with their customers' data, who is the controller and who the processor?","a":"The client is the controller; I'm usually the processor handling data for them."},{"id":"c1xqyn41","phase":"p6","q":"Name four rules for handling a client's personal data.","a":"Use as little as possible; keep it out of prompts; store no more than needed; have the client agree to how I handle it in writing. No health data without proper advice."},{"id":"cqkfmq","phase":"p6","q":"Is building n8n workflows for money for clients allowed?","a":"Yes, charging for workflow creation, setup and maintenance is allowed under the Community license FAQ."},{"id":"c101do6n","phase":"p6","q":"What is not allowed?","a":"Hosting n8n as a service so clients build their own workflows, white-labelling it, or using enterprise features without a licence."},{"id":"cdf3tyw","phase":"p6","q":"What is the key question?","a":"Who builds and controls the workflows: if I do and the client only sees results, it's consulting; if clients use n8n themselves as a hosted service, it isn't allowed."},{"id":"cpdcsq0","phase":"p6","q":"What does Article 50 ask of a chatbot?","a":"Tell users at first contact they're talking to an AI (unless obvious) and offer a human route; it applies from 2 August 2026."},{"id":"c6m39lw","phase":"p6","q":"Whose API keys go in a client's workflow?","a":"The client's own, so I don't carry their costs or risk."},{"id":"c1vzk7by","phase":"p6","q":"What three things do you produce in p6-3?","a":"A list of accountant questions (sent or booked), three sentences on the n8n licence, and client-data-rules.md."},{"id":"cgxefa2","phase":"p6","q":"Why can't your laptop run a client's automation?","a":"It isn't on all the time, backed up or updated, and outside services can't reach localhost."},{"id":"cpdgcqo","phase":"p6","q":"What do webhooks from outside services need?","a":"A public HTTPS URL."},{"id":"c1i33i0r","phase":"p6","q":"Name the four hosting options.","a":"n8n Cloud, a client-owned small server (VPS), me hosting for several clients, and the client's existing tool such as Make or Zapier."},{"id":"c1dqilox","phase":"p6","q":"Which option is risky under the n8n licence and why?","a":"Me hosting for several clients, because hosting n8n as a service for clients isn't allowed without a paid licence."},{"id":"c1fps9am","phase":"p6","q":"Roughly what do n8n Cloud and a small VPS cost per month?","a":"Cloud Starter about 20 euros (2,500 executions); a small VPS roughly 4 to 10 euros (prices moved in 2026; check live prices today)."},{"id":"c2aqo89","phase":"p6","q":"What does Docker Compose do and which command starts it?","a":"It describes containers in one file so a server can be rebuilt with one command: `docker compose up -d`."},{"id":"ciewzlq","phase":"p6","q":"What is Kubernetes and does a small client need it?","a":"It runs and manages many containers across many servers. A small client's few workflows don't need it; it adds complexity and cost."},{"id":"chvgzcw","phase":"p6","q":"Which command starts a compose project and which stops and removes its containers?","a":"`docker compose up -d` starts it; `docker compose down` stops and removes the containers."},{"id":"c1bdlohy","phase":"p6","q":"Name the three monitoring checks.","a":"A spending limit and alerts in the AI provider's console, execution clean-up in n8n's settings, and an uptime ping on /healthz."},{"id":"c14v7ent","phase":"p6","q":"What are n8n's default execution-pruning values?","a":"Pruning is on; old executions are deleted after 336 hours (14 days) and the limit is 10,000 executions."},{"id":"cqsu962","phase":"p6","q":"What is the difference between /healthz and /healthz/readiness?","a":"/healthz returns 200 if n8n is reachable; /healthz/readiness returns 200 only if the database is connected and migrated."},{"id":"ct0mkai","phase":"p6","q":"What happens to the saved logins if the server disk dies and there's no backup of the key?","a":"They become unreadable and can't be recovered (unless a decrypted export was made earlier)."},{"id":"c1k6ypxr","phase":"p6","q":"What do CLI exports not include?","a":"Users, execution history, variables and the encryption key."},{"id":"crr9ezs","phase":"p6","q":"How do you charge for upkeep after handover?","a":"Monthly maintenance is a paid extra, quoted separately."},{"id":"ck9v3sy","phase":"p6","q":"What are the four things you write in p6-4?","a":"A hosting options page with live prices, a 4-sentence client answer, the three monitoring checks with where each is set, and a 3-sentence Compose/Kubernetes explanation."},{"id":"clfu6yz","phase":"p6","q":"Why agree the rules early?","a":"It's much easier before there's any money, and written rules protect the friendship."},{"id":"c1kxufgu","phase":"p6","q":"List five decisions the team agreement covers.","a":"Roles, how work is divided, how money is split and paid out, what happens if someone leaves, and loose team versus company."},{"id":"c4g5zap","phase":"p6","q":"How do you share logins and keys in a team?","a":"Through a shared password manager and shared accounts with access control, never over chat."},{"id":"coezbtm","phase":"p6","q":"What are the five agenda points?","a":"Skills, roles, money split, first target client type, and how to review each other's work."},{"id":"cb5odir","phase":"p6","q":"Who decides the roles and the money split?","a":"The four of us. Claude only helps prepare options and never decides."},{"id":"cbel26y","phase":"p6","q":"What does the shared repo hold?","a":"The team's scripts, exported workflows, templates and case studies."},{"id":"c18erbfe","phase":"p6","q":"How do teammates get access?","a":"I add them as collaborators; each clones the repo to their own computer."},{"id":"c174ev9n","phase":"p6","q":"Why does nobody commit straight to `main`?","a":"Changes go through a branch and a pull request so a teammate reviews them first; that catches mistakes."},{"id":"cph5nzl","phase":"p6","q":"List the commands to start a change and upload it.","a":"`git switch main`, `git pull`, `git switch -c \u003cbranch>`, edit, `git add .`, `git commit -m \"...\"`, `git push -u origin \u003cbranch>`, then open a PR."},{"id":"c17ww9s1","phase":"p6","q":"What do you leave in a review?","a":"At least one question and one suggestion, about the change and not the person."},{"id":"cn6jbvm","phase":"p6","q":"When does a merge conflict happen?","a":"When two branches change the same lines, so Git can't choose."},{"id":"c15eycza","phase":"p6","q":"What do the markers mean and how do you finish?","a":"The part after `\u003c\u003c\u003c\u003c\u003c\u003c\u003c` is one side, after `=======` the other. I choose the final text, delete the markers, `git add .` and `git commit`."},{"id":"c1uid9jt","phase":"p6","q":"Someone committed an API key. What do you do?","a":"Rotate the key straight away (new key, old disabled). Deleting the file isn't enough because it stays in the history."},{"id":"cjvbbif","phase":"p6","q":"List the five rules.","a":"No commits straight to main; small PRs; clear commit messages; never commit secrets or exported credentials; every PR reviewed by someone else."},{"id":"c1xuwv5s","phase":"p6","q":"Where do team logins and API keys live?","a":"In a shared password manager, never in chat or the repo."},{"id":"c2r22o9","phase":"p6","q":"What happens after the two practice PRs are opened?","a":"Merge the first, then resolve the conflict in the second together."},{"id":"crt5h0r","phase":"p6","q":"What is the formula for a one-sentence offer?","a":"I help [who] [get result] by [method], where the result is something the client counts."},{"id":"c1bltrre","phase":"p6","q":"Is a niche a limit?","a":"No; it makes you easy to remember and refer."},{"id":"c4xrkry","phase":"p6","q":"Name three kinds of evidence for a niche.","a":"Which jobs got replies, which calls felt natural, and which projects I enjoyed (and which packages got interest)."},{"id":"c19ekjtm","phase":"p6","q":"What are the three steps?","a":"Write three candidate one-sentence offers from my evidence, pick one to try for a month, and update my headline and team pitch."}],"phases":[{"id":"p0","tag":"Phase 0","name":"Setup and baseline"},{"id":"p1","tag":"Phase 1","name":"The plumbing"},{"id":"p2","tag":"Phase 2","name":"n8n core"},{"id":"p3","tag":"Phase 3","name":"AI in automations and agents"},{"id":"p4","tag":"Phase 4","name":"Portfolio and case studies"},{"id":"p5","tag":"Phase 5","name":"Selling"},{"id":"p6","tag":"Phase 6","name":"Deliver, repeat, bring the friends in"}],"dashboardUrl":"https://claude.ai/artifact/DmXKL2aJSErjY9fwktBchT"};
  var CARDS = DATA.cards, PHASES = DATA.phases;
  var DAY = 86400000;
  var INTERVAL_DAYS = [0, 1, 2, 4, 7, 14, 30]; // days until a card returns, by box
  var NEW_PER_SESSION = 10;

  var state = {};          // card id -> { box, due }
  var mode = "pending";    // pending | db | local
  var col = null;
  var phase = "all";
  var practice = false;
  var queue = [];
  var current = null;
  var revealed = false;
  var typed = "";
  var requeued = {};
  var chains = {};

  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function inPhase(c) { return phase === "all" || c.phase === phase; }
  function isNew(c) { return !state[c.id]; }
  function isDue(c) { var s = state[c.id]; return !!s && s.due <= Date.now(); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  function say(t) { el("toast").textContent = t; setTimeout(function () { if (el("toast").textContent === t) el("toast").textContent = ""; }, 5000); }
  function saveLocal() { try { localStorage.setItem("quiz-state", JSON.stringify(state)); } catch (e) {} }

  function buildQueue() {
    var pool = CARDS.filter(inPhase);
    if (practice) { queue = shuffle(pool.slice()); }
    else {
      var due = pool.filter(isDue).sort(function (a, b) { return state[a.id].due - state[b.id].due; });
      var fresh = shuffle(pool.filter(isNew)).slice(0, NEW_PER_SESSION);
      queue = due.concat(fresh);
    }
    requeued = {};
    next();
  }

  function next() {
    current = queue.shift() || null;
    revealed = false; typed = "";
    render();
  }

  function stats() {
    var due = 0, fresh = 0, learning = 0, known = 0;
    CARDS.forEach(function (c) {
      if (!inPhase(c)) return;
      var s = state[c.id];
      if (!s) fresh++;
      else { if (s.due <= Date.now()) due++; if (s.box >= 4) known++; else learning++; }
    });
    el("s-due").textContent = due; el("s-new").textContent = fresh; el("s-learning").textContent = learning; el("s-known").textContent = known;
  }

  function render() {
    stats();
    var stage = el("stage");
    if (!current) {
      stage.innerHTML = '<div class="card empty"><h2>' + (practice ? "End of the deck" : "Nothing due right now") + '</h2><p class="note">' +
        (practice ? "You went through every card in this selection." : "Come back later, pick another phase, or choose Practise everything.") + "</p></div>";
      return;
    }
    var s = state[current.id];
    var ph = PHASES.filter(function (p) { return p.id === current.phase; })[0];
    var h = '<div class="card"><div class="meta"><span>' + esc(ph ? ph.tag + ": " + ph.name : "") + "</span><span>" + queue.length + " more after this</span>" +
      (s ? "<span>box " + s.box + " of 6</span>" : "<span>new card</span>") + "</div>" +
      '<div class="q">' + esc(current.q) + "</div>";
    if (!revealed) {
      h += '<label class="label" for="ans">Write your answer first</label><textarea id="ans" placeholder="Say it in your own words before you look">' + esc(typed) + "</textarea>" +
        '<div class="row"><button class="btn primary" id="reveal">Show the answer</button></div>';
    } else {
      h += (typed ? '<div><div class="label">You wrote</div><div class="mine">' + esc(typed) + "</div></div>" : "") +
        '<div class="answer"><div class="label">Answer</div><div>' + esc(current.a) + "</div></div>" +
        '<div class="label">Did your answer cover it?</div>' +
        '<div class="row"><button class="btn bad" id="missed">Missed it</button><button class="btn good" id="got">Got it</button></div>';
      if (practice) h += '<p class="note">Practise mode doesn\'t change your schedule.</p>';
    }
    stage.innerHTML = h + "</div>";
    var ans = el("ans");
    if (ans) { ans.focus({ preventScroll: true }); ans.addEventListener("input", function () { typed = ans.value; }); }
  }

  function write(id, rec) {
    state[id] = rec;
    if (mode === "db") {
      var prev = chains[id] || Promise.resolve();
      chains[id] = prev.then(function () { return col.doc(id).set(rec); }).catch(function () { say("Could not save that answer. Check your connection."); });
    } else { saveLocal(); }
  }

  function grade(ok) {
    var c = current;
    if (!practice) {
      var s = state[c.id] || { box: 0 };
      var box = ok ? Math.min(s.box + 1, 6) : 0;
      var due = ok ? Date.now() + INTERVAL_DAYS[box] * DAY : Date.now() + 10 * 60000;
      write(c.id, { box: box, due: due });
    }
    if (!ok && !requeued[c.id]) { requeued[c.id] = true; queue.push(c); }
    next();
  }

  document.addEventListener("click", function (e) {
    var t = e.target;
    if (t.id === "reveal") { revealed = true; render(); return; }
    if (t.id === "got") { grade(true); return; }
    if (t.id === "missed") { grade(false); return; }
    var chip = t.closest("[data-phase]");
    if (chip) { phase = chip.getAttribute("data-phase"); drawChips(); buildQueue(); return; }
  });
  el("m-due").addEventListener("click", function () { practice = false; el("m-due").setAttribute("aria-pressed", true); el("m-all").setAttribute("aria-pressed", false); buildQueue(); });
  el("m-all").addEventListener("click", function () { practice = true; el("m-due").setAttribute("aria-pressed", false); el("m-all").setAttribute("aria-pressed", true); buildQueue(); });

  function drawChips() {
    var h = '<button class="chip" data-phase="all" aria-pressed="' + (phase === "all") + '">All phases</button>';
    PHASES.forEach(function (p) { h += '<button class="chip" data-phase="' + p.id + '" aria-pressed="' + (phase === p.id) + '">' + esc(p.tag) + "</button>"; });
    el("chips").innerHTML = h;
  }

  function setSync() {
    el("dot").className = "dot" + (mode === "db" ? " on" : "");
    el("syncmsg").textContent = mode === "db" ? "Synced across your devices." : mode === "local" ? "Saved on this device only." : "Loading";
  }
  el("dashlink").href = DATA.dashboardUrl;

  drawChips();
  render();

  (async function () {
    var db = null;
    try { db = window.claude ? await window.claude.use("db") : null; } catch (e) { db = null; }
    function useLocal() {
      try { state = JSON.parse(localStorage.getItem("quiz-state") || "{}") || {}; } catch (e) { state = {}; }
      mode = "local"; setSync(); buildQueue();
    }
    if (!db) { useLocal(); return; }
    col = db.collection("cards");
    var first = true;
    col.onSnapshot(function (snap) {
      var s = {};
      snap.docs.forEach(function (d) { var v = d.data(); if (v && typeof v.box === "number") s[d.id] = { box: v.box, due: v.due }; });
      // keep an answer I just gave until the server confirms it
      Object.keys(chains).forEach(function (id) { if (state[id] && !s[id]) s[id] = state[id]; });
      state = s; mode = "db"; setSync();
      if (first) { first = false; buildQueue(); } else { stats(); }
    }, useLocal);
  })();
})();
</script>
