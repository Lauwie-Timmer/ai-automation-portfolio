<title>Roadmap Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Layout: one centred column. Stats strip, phase chips, then a single card you answer before it reveals. */
  :root {
    --bg: #edf0f3; --surface: #ffffff; --surface-2: #f5f7f9; --ink: #131c26; --muted: #5b6877; --line: #d5dbe2;
    --accent: #2a5bd7; --accent-soft: #e3ebfb; --good: #1f8a5b; --good-soft: #ddf2e7; --bad: #b3261e; --bad-soft: #fbe3e1;
    --font-body: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e141b; --surface: #151d26; --surface-2: #1a242f; --ink: #e7edf3; --muted: #93a0ae; --line: #26323e;
      --accent: #6f9bff; --accent-soft: #1b2a47; --good: #4cc38a; --good-soft: #14301f; --bad: #ff8a80; --bad-soft: #3a1d1b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e141b; --surface: #151d26; --surface-2: #1a242f; --ink: #e7edf3; --muted: #93a0ae; --line: #26323e;
    --accent: #6f9bff; --accent-soft: #1b2a47; --good: #4cc38a; --good-soft: #14301f; --bad: #ff8a80; --bad-soft: #3a1d1b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; padding-inline: 16px; padding-block: 28px 56px; }
  .wrap { max-width: 640px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
  button, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 4px 0 2px; font-size: clamp(26px, 6vw, 34px); line-height: 1.1; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); }

  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  .stat b { display: block; font-family: var(--font-mono); font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  @media (max-width: 460px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .card .q { font-size: clamp(18px, 4.5vw, 22px); font-weight: 600; line-height: 1.35; text-wrap: balance; }
  .card textarea { width: 100%; min-height: 96px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); padding: 10px 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; flex: 1 1 140px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.good { background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .btn.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
  .answer { background: var(--accent-soft); border-radius: 8px; padding: 12px 14px; }
  .answer .label { color: var(--accent); }
  .mine { color: var(--muted); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--muted); font-size: 13px; }
  .empty { text-align: center; padding: 28px 12px; }
  .empty h2 { margin: 0 0 6px; font-size: 20px; }
  .note { color: var(--muted); font-size: 13px; }
  footer { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 13px; align-items: center; }
  footer .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  footer .dot.on { background: var(--good); }
  .toast { color: var(--bad); }
</style>

<div class="wrap">
  <header>
    <div class="label">Spaced repetition</div>
    <h1>Roadmap Quiz</h1>
    <p>Write your answer first, then check it. Cards you know come back later. Cards you miss come back soon.</p>
  </header>

  <section class="stats" aria-label="Progress">
    <div class="stat"><b id="s-due">0</b><span>due now</span></div>
    <div class="stat"><b id="s-new">0</b><span>new</span></div>
    <div class="stat"><b id="s-learning">0</b><span>learning</span></div>
    <div class="stat"><b id="s-known">0</b><span>well known</span></div>
  </section>

  <div class="chips" id="chips" role="group" aria-label="Choose phase"></div>
  <div class="chips" role="group" aria-label="Mode">
    <button class="chip" id="m-due" aria-pressed="true">Due and new</button>
    <button class="chip" id="m-all" aria-pressed="false">Practise everything</button>
  </div>

  <main id="stage" aria-live="polite"></main>

  <footer>
    <span><i class="dot" id="dot"></i><span id="syncmsg">Loading</span></span>
    <span class="toast" id="toast" role="status"></span>
    <a id="dashlink" href="#" target="_blank" rel="noopener">Open the roadmap dashboard</a>
  </footer>
</div>

<script>
(function () {
  var DATA = __QUIZ__;
  var CARDS = DATA.cards, PHASES = DATA.phases;
  var DAY = 86400000;
  var INTERVAL_DAYS = [0, 1, 2, 4, 7, 14, 30]; // days until a card returns, by box
  var NEW_PER_SESSION = 10;

  var state = {};          // card id -> { box, due }
  var mode = "pending";    // pending | db | local
  var col = null;
  var phase = "all";
  var practice = false;
  var queue = [];
  var current = null;
  var revealed = false;
  var typed = "";
  var requeued = {};
  var chains = {};

  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function inPhase(c) { return phase === "all" || c.phase === phase; }
  function isNew(c) { return !state[c.id]; }
  function isDue(c) { var s = state[c.id]; return !!s && s.due <= Date.now(); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  function say(t) { el("toast").textContent = t; setTimeout(function () { if (el("toast").textContent === t) el("toast").textContent = ""; }, 5000); }
  function saveLocal() { try { localStorage.setItem("quiz-state", JSON.stringify(state)); } catch (e) {} }

  function buildQueue() {
    var pool = CARDS.filter(inPhase);
    if (practice) { queue = shuffle(pool.slice()); }
    else {
      var due = pool.filter(isDue).sort(function (a, b) { return state[a.id].due - state[b.id].due; });
      var fresh = shuffle(pool.filter(isNew)).slice(0, NEW_PER_SESSION);
      queue = due.concat(fresh);
    }
    requeued = {};
    next();
  }

  function next() {
    current = queue.shift() || null;
    revealed = false; typed = "";
    render();
  }

  function stats() {
    var due = 0, fresh = 0, learning = 0, known = 0;
    CARDS.forEach(function (c) {
      if (!inPhase(c)) return;
      var s = state[c.id];
      if (!s) fresh++;
      else { if (s.due <= Date.now()) due++; if (s.box >= 4) known++; else learning++; }
    });
    el("s-due").textContent = due; el("s-new").textContent = fresh; el("s-learning").textContent = learning; el("s-known").textContent = known;
  }

  function render() {
    stats();
    var stage = el("stage");
    if (!current) {
      stage.innerHTML = '<div class="card empty"><h2>' + (practice ? "End of the deck" : "Nothing due right now") + '</h2><p class="note">' +
        (practice ? "You went through every card in this selection." : "Come back later, pick another phase, or choose Practise everything.") + "</p></div>";
      return;
    }
    var s = state[current.id];
    var ph = PHASES.filter(function (p) { return p.id === current.phase; })[0];
    var h = '<div class="card"><div class="meta"><span>' + esc(ph ? ph.tag + ": " + ph.name : "") + "</span><span>" + queue.length + " more after this</span>" +
      (s ? "<span>box " + s.box + " of 6</span>" : "<span>new card</span>") + "</div>" +
      '<div class="q">' + esc(current.q) + "</div>";
    if (!revealed) {
      h += '<label class="label" for="ans">Write your answer first</label><textarea id="ans" placeholder="Say it in your own words before you look">' + esc(typed) + "</textarea>" +
        '<div class="row"><button class="btn primary" id="reveal">Show the answer</button></div>';
    } else {
      h += (typed ? '<div><div class="label">You wrote</div><div class="mine">' + esc(typed) + "</div></div>" : "") +
        '<div class="answer"><div class="label">Answer</div><div>' + esc(current.a) + "</div></div>" +
        '<div class="label">Did your answer cover it?</div>' +
        '<div class="row"><button class="btn bad" id="missed">Missed it</button><button class="btn good" id="got">Got it</button></div>';
      if (practice) h += '<p class="note">Practise mode doesn\'t change your schedule.</p>';
    }
    stage.innerHTML = h + "</div>";
    var ans = el("ans");
    if (ans) { ans.focus({ preventScroll: true }); ans.addEventListener("input", function () { typed = ans.value; }); }
  }

  function write(id, rec) {
    state[id] = rec;
    if (mode === "db") {
      var prev = chains[id] || Promise.resolve();
      chains[id] = prev.then(function () { return col.doc(id).set(rec); }).catch(function () { say("Could not save that answer. Check your connection."); });
    } else { saveLocal(); }
  }

  function grade(ok) {
    var c = current;
    if (!practice) {
      var s = state[c.id] || { box: 0 };
      var box = ok ? Math.min(s.box + 1, 6) : 0;
      var due = ok ? Date.now() + INTERVAL_DAYS[box] * DAY : Date.now() + 10 * 60000;
      write(c.id, { box: box, due: due });
    }
    if (!ok && !requeued[c.id]) { requeued[c.id] = true; queue.push(c); }
    next();
  }

  document.addEventListener("click", function (e) {
    var t = e.target;
    if (t.id === "reveal") { revealed = true; render(); return; }
    if (t.id === "got") { grade(true); return; }
    if (t.id === "missed") { grade(false); return; }
    var chip = t.closest("[data-phase]");
    if (chip) { phase = chip.getAttribute("data-phase"); drawChips(); buildQueue(); return; }
  });
  el("m-due").addEventListener("click", function () { practice = false; el("m-due").setAttribute("aria-pressed", true); el("m-all").setAttribute("aria-pressed", false); buildQueue(); });
  el("m-all").addEventListener("click", function () { practice = true; el("m-due").setAttribute("aria-pressed", false); el("m-all").setAttribute("aria-pressed", true); buildQueue(); });

  function drawChips() {
    var h = '<button class="chip" data-phase="all" aria-pressed="' + (phase === "all") + '">All phases</button>';
    PHASES.forEach(function (p) { h += '<button class="chip" data-phase="' + p.id + '" aria-pressed="' + (phase === p.id) + '">' + esc(p.tag) + "</button>"; });
    el("chips").innerHTML = h;
  }

  function setSync() {
    el("dot").className = "dot" + (mode === "db" ? " on" : "");
    el("syncmsg").textContent = mode === "db" ? "Synced across your devices." : mode === "local" ? "Saved on this device only." : "Loading";
  }
  el("dashlink").href = DATA.dashboardUrl;

  drawChips();
  render();

  (async function () {
    var db = null;
    try { db = window.claude ? await window.claude.use("db") : null; } catch (e) { db = null; }
    function useLocal() {
      try { state = JSON.parse(localStorage.getItem("quiz-state") || "{}") || {}; } catch (e) { state = {}; }
      mode = "local"; setSync(); buildQueue();
    }
    if (!db) { useLocal(); return; }
    col = db.collection("cards");
    var first = true;
    col.onSnapshot(function (snap) {
      var s = {};
      snap.docs.forEach(function (d) { var v = d.data(); if (v && typeof v.box === "number") s[d.id] = { box: v.box, due: v.due }; });
      // keep an answer I just gave until the server confirms it
      Object.keys(chains).forEach(function (id) { if (state[id] && !s[id]) s[id] = state[id]; });
      state = s; mode = "db"; setSync();
      if (first) { first = false; buildQueue(); } else { stats(); }
    }, useLocal);
  })();
})();
</script>
